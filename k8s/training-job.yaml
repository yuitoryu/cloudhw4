apiVersion: batch/v1
kind: Job
metadata:
  name: mnist-training
  namespace: mnist-hw4
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  activeDeadlineSeconds: 1200
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: trainer
          image: us-central1-docker.pkg.dev/summer-bond-475605-r6/mnist-hw4/training:v1
          env:
            - name: MODEL_DIR
              value: /models
          resources:
            requests:
              cpu: "1"
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mnist-models
