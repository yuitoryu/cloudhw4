apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnist-inference
  namespace: mnist-hw4
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mnist-inference
  template:
    metadata:
      labels:
        app: mnist-inference
    spec:
      automountServiceAccountToken: false
      containers:
        - name: inference
          image: us-central1-docker.pkg.dev/summer-bond-475605-r6/mnist-hw4/inference:v2
          env:
            - name: MODEL_DIR
              value: /models
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mnist-models
            readOnly: true
